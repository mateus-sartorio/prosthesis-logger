[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prothesis-mqtt-terminal-logger"
version = "0.1.0"
description = "Beautiful terminal logger for MQTT sensor events"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Prothesis" }]
dependencies = [
  "paho-mqtt>=2.1.0",
  "rich>=13.7.1",
  "typer>=0.12.5",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]

[project.scripts]
mqtt-log-listener = "mqtt_logger.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
